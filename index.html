<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergyControl | Login</title>
    <link rel="shortcut icon" href="./assets/raio.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section>
        <div class="card-login">
          <form id="form-login">
            <div class="inputs">
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Digite seu email"
                required
              />
              <input
                type="password"
                name="senha"
                id="senha"
                placeholder="Digite sua senha"
                required
              />
            </div>
            <div class="buttons">
              <button type="submit" class="button">Entrar na conta</button>
              <a href="./cadastro.html"
                >Ainda não tem uma conta?</a
              >
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="./controller/login.js" type="module"></script>
  </body>
</html>
