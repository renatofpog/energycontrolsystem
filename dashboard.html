<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergyControl | Dashboard</title>
    <link rel="shortcut icon" href="./assets/raio.svg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <script src="./services/auth-guard.js"></script>
  </head>
  <body>
    <header class="mobile-header">
      <div class="logo-mobile">
        <img src="./assets/raio.svg" alt="Raio" />
        <span>EnergyControl</span>
      </div>
      <button class="btn-hamburger" id="openMenuBtn" aria-label="Abrir menu">
        ☰
      </button>
    </header>

    <div class="app-container">
      <aside class="menu" id="sidebarMenu">
        <button class="btn-close" id="closeMenuBtn" aria-label="Fechar menu">
          &times;
        </button>

        <div class="logo">
          <img
            src="./assets/raio.svg"
            alt="Imagem de um raio"
            class="logo-icon"
          />
          <h1 class="logo-title">EnergyControl</h1>
        </div>

        <nav>
          <ul class="nav-links">
            <li><a href="./dashboard.html" class="active">Dashboard</a></li>
            <li><a href="./relatorios.html">Relatórios</a></li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <section class="equipamentos-section">
          <h2>Gerenciar Equipamentos</h2>

          <div class="search-bar">
            <input
              type="text"
              id="pesquisa"
              placeholder="Pesquisar equipamentos..."
            />
            <button class="btn-add">+ Cadastrar</button>
          </div>


          <div class="equipamentos-grid" id="equipamentos-grid">
            <p>Carregando equipamentos...</p>
          </div>
        </section>
      </main>
    </div>

    <script src="./services/menu.js"></script>
    <script type="module" src="./controller/dashboard.js"></script>


    <div id="modal-cadastro" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-titulo">Cadastrar Novo Equipamento</h3>
          <button id="btn-fechar-modal" class="btn-close-modal">&times;</button>
        </div>

        <form id="form-cadastrar-equipamento">
          <div class="inputs">
            <label for="nome-eq">Nome do Equipamento</label>
            <input
              type="text"
              id="nome-eq"
              placeholder="Ex: Ar Condicionado"
              required
            />

            <label for="potencia-eq">Potência (Watts)</label>
            <input
              type="number"
              id="potencia-eq"
              placeholder="Ex: 1200"
              required
            />

            <label for="horas-eq">Uso Diário (Horas)</label>
            <input type="number" id="horas-eq" placeholder="Ex: 8" required />

            <label for="daysWeek-eq">Dias de Uso por Semana</label>
            <input
              type="number"
              id="daysWeek-eq"
              placeholder="Ex: 5"
              required
            />
          </div>

          <div class="modal-actions">
            <button type="button" id="btn-cancelar" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-primary" id="btn-salvar">
              Salvar Equipamento
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="modal-delecao" class="modal-overlay" style="display: none">
      <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
          <h3>Excluir Equipamento</h3>
          <button id="btn-fechar-modal-del" class="btn-close-modal">&times;</button>
        </div>

        <div style="padding: 20px 0; color: #333; font-size: 15px;">
          <p>Deseja mesmo deletar o registro do equipamento?</p>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancelar-del" class="btn-secondary">
            Cancelar
          </button>
          <button type="button" id="btn-confirmar-del" class="btn-primary" style="background-color: #e11d48;">
            Deletar
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
